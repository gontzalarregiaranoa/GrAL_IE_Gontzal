[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "sentsore_db"

[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["sentsoreak/data"]
  data_format = "json"
